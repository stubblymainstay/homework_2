<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form class="form">
        <fieldset class="form-fieldset_1">
            <legend>Ваши личные данные</legend>
            <label for="text"> Ваше имя <br>
                <input id="text"
                type="text" 
                required 
                placeholder="Имя">
            </label>
            <label for="number"> Ваш возраст <br>
                <input 
                id="number" 
                type="number" 
                required
                placeholder="Возраст">
            </label>
            <label for="tel"> Ваш номер телефона <br>
                <input id="tel" 
                type="tel"
                required
                placeholder="Номер телефона">
            </label>
            <label for="email"> Ваша почта <br>
                <input id="email" 
                type="email" 
                required
                placeholder="Почта">
            </label>
            <label for="message"> Сообщение <br>
                <textarea id="message" placeholder="Ваше сообщение"></textarea>
            </label>
        </fieldset>
        <fieldset class="form-fieldset_2">
            <input type="checkbox" id="check" required>
            <label  >я принимаю правила</label> 
        </fieldset>
        <button>Отправить</button>
    </form>
</body>
</html>
