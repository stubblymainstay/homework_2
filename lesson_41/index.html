<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form class="form">
        <fieldset class="form-fieldset_1">
            <h4>Ваши личные данные</h2>
            <label> Ваше имя <br>
                <input 
                type="text" 
                required 
                placeholder="Имя">
            </label>
            <label> Ваш возраст <br>
                <input type="number" 
                required
                placeholder="Возраст">
            </label>
            <label> Ваш номер телефона <br>
                <input type="tel" 
                required
                placeholder="Номер телефона">
            </label>
            <label> Ваша почта <br>
                <input type="email" 
                required
                placeholder="Почта">
            </label>
            <label> Сообщение <br>
                <textarea placeholder="Ваше сообщение"></textarea>
            </label>
            <fieldset class="form-fieldset_2">
                <input  type="checkbox" id="check" required>
                <label for="check">я принимаю правила</label>
            </fieldset>
            <button>Отправить</button>
        </fieldset>
    </form>
</body>
</html>
